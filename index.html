*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background-image:url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800');background-size:cover;background-color:#87CEEB;min-height:100vh;padding-bottom:125px}
.box{max-width:420px;margin:12px auto;background:rgba(255,255,255,0.96);border-radius:24px;padding:14px;border:5px solid #FF6F00;box-shadow:0 12px 24px rgba(0,0,0,.2);text-align:center}
.btn{background:linear-gradient(90deg,#FF9800,#E65100);color:#fff;border:0;padding:14px;width:100%;border-radius:30px;font-weight:900;font-size:17px;margin-top:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#FFF8E1;padding:8px;border-radius:14px;margin:10px 0}
.c{background:#fff;border-radius:10px;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;border:2.5px solid #FFCC02;cursor:pointer}
.c.ok{background:#4CAF50!important;color:#fff!important}
.fallArea{position:relative;width:100%;height:420px;background:linear-gradient(180deg,#E1F5FE,#B3E5FC);border-radius:16px;overflow:hidden;border:3px solid #03A9F4;margin:10px 0}
.fallBubble{position:absolute;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;border:3px solid #fff;cursor:pointer;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-70px)}100%{transform:translateY(450px)}}
.bar{width:100%;height:20px;background:#eee;border-radius:20px;overflow:hidden;border:2px solid #FF6F00;margin:8px 0}
.f{height:100%;background:linear-gradient(90deg,#4CAF50,#8BC34A);width:0%;transition:0.5s}
.hidden{display:none!important}
#completeModal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:99999;padding:15px}
#completeBox{background:#fff;border-radius:28px;padding:22px;max-width:360px;width:100%;text-align:center;border:5px solid #FF6F00}

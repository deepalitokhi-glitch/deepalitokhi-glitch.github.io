<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punjabi Toffee Game</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#FFB74D url('https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=900') center/cover fixed;min-height:100vh;padding-bottom:150px}
.box{max-width:430px;margin:14px auto;background:#fffffffa;border-radius:26px;padding:16px;border:5px solid #FF6F00;text-align:center}
.btn{background:linear-gradient(90deg,#FF9800,#E65100);color:#fff;border:0;padding:14px;width:100%;border-radius:32px;font-weight:900;font-size:17px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#FFF8E1;padding:10px;border-radius:16px;margin:12px 0}
.c{background:#fff;border-radius:12px;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #FFCC02;font-weight:800}
.c.ok{background:#4CAF50!important;color:#fff!important}
.fallArea{position:relative;width:100%;height:460px;background:linear-gradient(180deg,#E1F5FE,#81D4FA);border-radius:18px;overflow:hidden;border:3px solid #03A9F4;margin:12px 0}
.fallBubble{position:absolute;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;border:3px solid #fff;cursor:pointer}
.bar{width:100%;height:20px;background:#eee;border-radius:20px;overflow:hidden;border:2px solid #FF6F00;margin:10px 0}
.f{height:100%;background:#4CAF50;width:0%;transition:.5s}
.hidden{display:none!important}
#completeModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
#completeBox{background:#fff;border-radius:32px;padding:24px;max-width:380px;width:100%;text-align:center;border:6px solid #FF6F00}
#adBox{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:5px solid #FF6F00;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;padding:8px;box-shadow:0 -4px 12px rgba(0,0,0,.2)}
@keyframes fallAnim{from{transform:translateY(-80px)} to{transform:translateY(500px)}}
</style>
</head>
<body>
<div class="box" id="menu">
<h1 style="color:#FF6F00;font-size:36px">ਪੰਜਾਬੀ ਟਾਫੀ</h1>
<p style="color:#E91E63;font-weight:900">6 LEVEL • AUTO VOICE 🔊</p>
<button class="btn" onclick="start(1)">Level 1 - Toffee</button>
<button class="btn" style="background:linear-gradient(90deg,#2196F3,#0D47A1)" onclick="start(2)">Level 2 - Bubble ੳ ਅ ੲ</button>
<button class="btn" style="background:linear-gradient(90deg,#9C27B0,#4A148C)" onclick="start(3)">Level 3 - ਕ ਖ ਗ</button>
<button class="btn" style="background:linear-gradient(90deg,#FF5722,#BF360C)" onclick="start(4)">Level 4 - ੧ ੨ ੩</button>
<button class="btn" style="background:linear-gradient(90deg,#009688,#004D40)" onclick="start(5)">Level 5 - ਮਾਂ ਪਾਣੀ</button>
<button class="btn" style="background:linear-gradient(90deg,#FFD700,#FF6F00);color:#000" onclick="start(6)">FINAL BOSS 👑</button>
</div>
<div class="box hidden" id="game">
<div style="display:flex;justify-content:space-between;font-weight:900"><span id="lv">Level 1</span><span id="sc" style="color:#E91E63">0/9</span></div>
<div class="bar"><div id="pf" class="f"></div></div>
<p id="msg" style="color:#E91E63;font-weight:900;margin:8px 0"></p>
<div id="area"></div>
<button class="btn" style="background:#9E9E9E" onclick="showMenu()">Menu</button>
</div>
<div id="completeModal" class="hidden"><div id="completeBox">
<div style="font-size:60px">🎉</div>
<h2 style="color:#FF6F00" id="modalTitle">ਸ਼ਾਬਾਸ਼ ਜੀ!</h2>
<p id="completeText" style="font-size:19px;font-weight:800">Level Complete!</p>
<p style="font-size:30px">⭐⭐⭐</p>
<p id="nextPreview" style="background:#E8F5E9;border:2px dashed #4CAF50;border-radius:12px;padding:10px;margin:10px 0;font-weight:800;color:#2E7D32"></p>
<div id="normalBtns">
<button class="btn" style="background:#4CAF50;font-size:20px" onclick="goNext()">Next Level →</button>
<button class="btn" style="background:#FF9800" onclick="replayNow()">Replay</button>
<button class="btn" style="background:#9E9E9E" onclick="showMenu()">Menu</button>
</div>
<div id="finalBtns" class="hidden">
<button class="btn" style="background:#4CAF50" onclick="showMenu()">Main Menu</button>
<button class="btn" style="background:#FFD700;color:#000" onclick="start(1)">Fir Se Khelo</button>
</div>
</div></div>
<div id="adBox">
<p style="font-size:12px;color:#E65100;font-weight:900">AD - Support 🙏</p>
<ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-1905215538239803" data-ad-slot="1234567890"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
<p style="font-size:10px;color:#999">Ad 1-2 din me dikhne lagegi (AdSense approve ke baad)</p>
</div>
<script>
let level=1,score=0,sel=[],board=[],ac,fallInterval=null,fallTimeouts=[];
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
function tone(f){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f;g.gain.setValueAtTime(.4,ac.currentTime);g.gain.exponentialRampToValueAtTime(.01,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3);}catch(e){}}
function clearAll(){if(fallInterval){clearInterval(fallInterval);fallInterval=null;}fallTimeouts.forEach(t=>clearTimeout(t));fallTimeouts=[];}
function showMenu(){clearAll();try{speechSynthesis.cancel();}catch(e){}document.getElementById('completeModal').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');document.getElementById('game').classList.add('hidden');}
function start(l){clearAll();level=l;document.getElementById('menu').classList.add('hidden');document.getElementById('game').classList.remove('hidden');tone(800);let m={1:'Level ek',2:'Level do, bubble phodo',3:'Ka Kha Ga',4:'Ginti ek do teen',5:'Maa paani ghar',6:'Final boss'};speak(m[l]);make();}
function goNext(){document.getElementById('completeModal').classList.add('hidden');clearAll();level++;if(level>6){document.getElementById('modalTitle').innerText="Champion! 🏆";document.getElementById('completeText').innerText="SARE 6 LEVEL WIN!";document.getElementById('nextPreview').innerText="Aap Champion ho!";document.getElementById('normalBtns').classList.add('hidden');document.getElementById('finalBtns').classList.remove('hidden');document.getElementById('completeModal').classList.remove('hidden');speak('Champion ban gaye');return;}make();}
function replayNow(){document.getElementById('completeModal').classList.add('hidden');clearAll();make();}
function showComplete(t){document.getElementById('completeText').innerText=t;let names={2:'Level 2 Bubble',3:'Level 3 Ka Kha Ga',4:'Level 4 Ginti',5:'Level 5 Shabd',6:'FINAL BOSS'};document.getElementById('nextPreview').innerText=level<6?"Next: "+names[level+1]:"Last Level";document.getElementById('normalBtns').classList.remove('hidden');document.getElementById('finalBtns').classList.add('hidden');document.getElementById('completeModal').classList.remove('hidden');tone(1200);speak('Shabaash ji, '+t);}
function make(){
 clearAll();let area=document.getElementById('area');area.innerHTML='';sel=[];score=0;
 document.getElementById('lv').innerText='Level '+level;document.getElementById('sc').innerText='0/9';document.getElementById('pf').style.width='0%';document.getElementById('completeModal').classList.add('hidden');
 if([1,3,4,5].includes(level)){
  let icons=level==1?["🍪","🍩","🧁"]:level==3?["ਕ","ਖ","ਗ"]:level==4?["੧","੨","੩"]:["ਮਾਂ","ਪਾਣੀ","ਘਰ"];
  let p=[];for(let j=0;j<3;j++)for(let i=0;i<9;i++)p.push(icons[j]);p.sort(()=>Math.random()-.5);board=p;
  let g=document.createElement('div');g.className='grid';
  for(let i=0;i<27;i++){let d=document.createElement('div');d.className='c';d.innerText=p[i];if(level==5)d.style.fontSize='18px';d.onclick=function(){if(this.classList.contains('ok'))return;tone(650);speak(this.innerText);this.style.background='#FCE4EC';sel.push(i);if(sel.length==3){let a=board[sel[0]],b=board[sel[1]],c=board[sel[2]],all=g.querySelectorAll('.c');if(a==b&&b==c){tone(950);sel.forEach(s=>{all[s].innerText='✅';all[s].className='c ok';});score++;upd();sel=[];if(score>=9)setTimeout(()=>showComplete("Level "+level+" Complete!"),600);}else{tone(180);let t=[...sel];setTimeout(()=>{t.forEach(s=>all[s].style.background='#fff');},350);sel=[];}}};g.appendChild(d);}area.appendChild(g);
  document.getElementById('msg').innerText=level==1?'3 same toffee chuno':level==3?'ਕ ਖ ਗ - 3 same chuno':level==4?'੧ ੨ ੩ - 3 same':"ਮਾਂ ਪਾਣੀ ਘਰ - 3 same";
 }else{
  let target=level==2?["ੳ","ਅ","ੲ"]:["ੳ","ਕ","੧","🍪"];
  let all=level==2?["ੳ","ਅ","ੲ","ਸ","ਹ"]:["ੳ","ਅ","ਕ","ਖ","੧","੨","🍪","🍩"];
  let fa=document.createElement('div');fa.className='fallArea';area.appendChild(fa);
  document.getElementById('msg').innerText=level==2?'ੳ ਅ ੲ phodo - tezi se!':'FINAL BOSS - tezi se phodo!';
  let speed=level==6?350:650;
  fallInterval=setInterval(()=>{
   if(score>=9){clearAll();return;}
   let ch=all[Math.floor(Math.random()*all.length)];
   let b=document.createElement('div');b.className='fallBubble';b.innerText=ch;
   b.style.left=Math.random()*75+'%';b.style.top='-70px';
   b.style.background=target.includes(ch)?'radial-gradient(circle at 30% 30%,#FFEB3B,#FF9800,#E65100)':'radial-gradient(circle at 30% 30%,#81D4FA,#0288D1,#01579B)';
   let dur=level==6?(1.2+Math.random()*1):(2+Math.random()*1.2);
   b.style.animation=`fallAnim ${dur}s linear forwards`;
   b.onclick=function(){
    if(target.includes(ch)){tone(950);speak(ch);this.innerText='✅';this.style.background='#4CAF50';score++;upd();setTimeout(()=>{if(this.parentNode)this.remove();},200);
     if(score>=9){clearAll();setTimeout(()=>{if(level==6){document.getElementById('modalTitle').innerText="FINAL WINNER! 🏆";document.getElementById('completeText').innerText="FINAL BOSS WIN!";document.getElementById('nextPreview').innerText="Champion!";document.getElementById('normalBtns').classList.add('hidden');document.getElementById('finalBtns').classList.remove('hidden');document.getElementById('completeModal').classList.remove('hidden');speak('Final winner');}else showComplete("Level "+level+" Complete!");},600);}
    }else{tone(150);this.style.opacity='.3';}
   };
   fa.appendChild(b);
   let to=setTimeout(()=>{if(b.parentNode)b.remove();}, (dur*1000+200));fallTimeouts.push(to);
  },speed);
 }
}
function upd(){document.getElementById('sc').innerText=score+'/9';document.getElementById('pf').style.width=score/9*100+'%';}
</script>
</body>
</html>
